<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="980" height="520" fill="#fcfcfb"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#0b0b0b">PlantWatch topology: five segments, two routers, one host</text>
  <text x="24" y="54" fill="#52514e">Each box is a Linux network namespace. Lines are veth links. Impairments (tc netem / tbf) are applied on the WAN link.</text>

  <!-- zones -->
  <g fill="none" stroke="#c3c2b7" stroke-dasharray="5 4">
    <rect x="20" y="80" width="250" height="170" rx="8"/>
    <rect x="20" y="300" width="250" height="190" rx="8"/>
    <rect x="700" y="80" width="260" height="170" rx="8"/>
    <rect x="700" y="300" width="260" height="190" rx="8"/>
  </g>
  <g fill="#52514e" font-size="12">
    <text x="32" y="100">CLIENT ZONE  ·  segment 1  ·  10.14.1.0/24</text>
    <text x="32" y="320">OPERATIONS ZONE  ·  segment 4  ·  10.14.4.0/24</text>
    <text x="712" y="100">SERVICE ZONE  ·  segment 2  ·  10.14.2.0/24</text>
    <text x="712" y="320">DATA ZONE  ·  segment 3  ·  10.14.3.0/24</text>
  </g>

  <!-- links -->
  <g stroke="#52514e" stroke-width="2" fill="none">
    <path d="M250 170 H330 V250"/>
    <path d="M250 400 H330 V310"/>
    <path d="M420 280 H560" stroke="#2a78d6" stroke-width="3"/>
    <path d="M650 250 V170 H720"/>
    <path d="M650 310 V400 H720"/>
  </g>

  <!-- hosts -->
  <g stroke="#0b0b0b" stroke-width="1.2" fill="#ffffff">
    <rect x="40" y="115" width="210" height="110" rx="6"/>
    <rect x="40" y="335" width="210" height="130" rx="6"/>
    <rect x="720" y="115" width="220" height="110" rx="6"/>
    <rect x="720" y="335" width="220" height="130" rx="6"/>
    <rect x="290" y="250" width="130" height="60" rx="6" fill="#eef4fc"/>
    <rect x="560" y="250" width="130" height="60" rx="6" fill="#eef4fc"/>
  </g>
  <g fill="#0b0b0b">
    <text x="52" y="138" font-weight="600">pw-plant  10.14.1.10</text>
    <text x="52" y="160" fill="#52514e">machine simulators (replay.py)</text>
    <text x="52" y="178" fill="#52514e">bench.py, iperf3 client</text>
    <text x="52" y="196" fill="#52514e">trusts the lab CA only</text>

    <text x="52" y="358" font-weight="600">pw-ops  10.14.4.10</text>
    <text x="52" y="380" fill="#52514e">health monitor</text>
    <text x="52" y="398" fill="#52514e">alert consumer</text>
    <text x="52" y="416" fill="#52514e">watchdog probe source</text>
    <text x="52" y="434" fill="#52514e">evidence collection</text>

    <text x="732" y="138" font-weight="600">pw-api  10.14.2.10</text>
    <text x="732" y="160" fill="#52514e">FastAPI over HTTPS  tcp/8443</text>
    <text x="732" y="178" fill="#52514e">TLS 1.3, cert signed by lab CA</text>
    <text x="732" y="196" fill="#52514e">iperf3 server  tcp/5201</text>

    <text x="732" y="358" font-weight="600">pw-db  10.14.3.10</text>
    <text x="732" y="380" fill="#52514e">Redis  tcp/6379, password</text>
    <text x="732" y="398" fill="#52514e">append-only file persistence</text>
    <text x="732" y="416" fill="#52514e">host firewall: only 10.14.2.10</text>
    <text x="732" y="434" fill="#52514e">not reachable from clients</text>

    <text x="302" y="274" font-weight="600">pw-r1  edge</text>
    <text x="302" y="294" fill="#52514e" font-size="12">nft: anti-spoof,</text>
    <text x="302" y="306" fill="#52514e" font-size="11">plant to ops denied</text>
    <text x="572" y="274" font-weight="600">pw-r2  DC</text>
    <text x="572" y="294" fill="#52514e" font-size="12">nft: forward drop,</text>
    <text x="572" y="306" fill="#52514e" font-size="11">allow-list below</text>
  </g>

  <!-- link labels -->
  <g fill="#52514e" font-size="12">
    <text x="440" y="270" fill="#2a78d6" font-weight="600">WAN 10.14.0.0/30</text>
    <text x="424" y="298">.1</text><text x="540" y="298">.2</text>
    <text x="338" y="240">.1.1</text><text x="338" y="330">.4.1</text>
    <text x="658" y="240">.2.1</text><text x="658" y="330">.3.1</text>
    <text x="345" y="200">pw-r1 static: 10.14.2.0/24 and 10.14.3.0/24 via 10.14.0.2</text>
    <text x="345" y="218">pw-r2 static: 10.14.1.0/24 and 10.14.4.0/24 via 10.14.0.1</text>
  </g>

  <!-- policy -->
  <g font-size="12">
    <text x="380" y="390" font-weight="600" fill="#0b0b0b">Policy on pw-r2</text>
    <text x="380" y="410" fill="#006300">✓ plant, ops → API  tcp/8443 (TLS)</text>
    <text x="380" y="428" fill="#006300">✓ API → Redis  tcp/6379</text>
    <text x="380" y="446" fill="#006300">✓ ICMP echo to API; ops → Redis host</text>
    <text x="380" y="464" fill="#d03b3b">✗ plant, ops → Redis (admin-prohibited)</text>
    <text x="380" y="482" fill="#d03b3b">✗ everything else</text>
  </g>
</svg>
